<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mara Rosanegra | Rincón Literario</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- Primero cargas el archivo con los datos -->
    <script src="blog-data.js"></script>

    <!-- Después cargas tu propio archivo de script donde manejas la web -->
    <script src="app.js"></script>

</head>
<body>

    <!-- Encabezado y Menú -->
    <header class="main-header">
        <div class="logo">Mara Rosanegra</div>
        <nav class="nav-links">
            <a href="index.html" class="active">Inicio</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <!-- Sección de Bienvenida -->
    <section class="hero-section">
        <h1>Bienvenidos a mi rincón literario</h1>
        <p class="tagline">Historias, reflexiones y poesía envueltas en misterio.</p>
    </section>

    <!-- Contenedor donde se cargarán los relatos -->
    <main class="container" id="blog-feed">
        <p style="text-align:center; font-style:italic; color:#777;">Buscando relatos en el archivo...</p>
    </main>

    <!-- Pie de página -->
    <footer class="main-footer">
        <p>&copy; 2026 Mara Rosanegra. Todos los derechos reservados.</p>
    </footer>

    <!-- Script Ultra-Resistente para Blogger JSON -->
    <script>
        fetch('blog.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo leer el archivo blog.json");
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('blog-feed');
                container.innerHTML = ""; // Limpiamos el mensaje de espera

                // Buscamos las entradas en cualquier rincón del JSON por seguridad
                let entries = [];
                if (data.feed && data.feed.entry) {
                    entries = data.feed.entry;
                } else if (data.entry) {
                    entries = data.entry;
                } else if (Array.isArray(data)) {
                    entries = data;
                }

                if (entries.length === 0) {
                    container.innerHTML = "<p style='text-align:center; font-style:italic;'>No se encontraron relatos dentro del archivo JSON.</p>";
                    return;
                }

                // Recorremos los relatos encontrados
                entries.forEach(post => {
                    // Extraer título
                    let title = "Relato sin título";
                    if (post.title && post.title.$t) title = post.title.$t;
                    else if (post.title) title = post.title;

                    // Extraer contenido del texto
                    let content = "";
                    if (post.content && post.content.$t) content = post.content.$t;
                    else if (post.summary && post.summary.$t) content = post.summary.$t;
                    else if (post.body) content = post.body;

                    if (content) {
                        // Cambiamos las imágenes antiguas de Blogger para que busquen en tu carpeta local 'img'
                        content = content.replace(/https:\/\/[\w\.\/-]+\/([^\/]+\.(?:jpg|jpeg|png|gif))/gi, 'img/$1');

                        // Creamos el artículo responsive en la pantalla
                        const article = document.createElement('article');
                        article.className = 'post-card';
                        article.innerHTML = `
                                <h2>${title}</h2>
                                <div class="contenido-relato">${content}</div>
                            `;
                        container.appendChild(article);
                    }
                });
            })
            .catch(error => {
                console.error('Error detallado:', error);
                document.getElementById('blog-feed').innerHTML = `
                        <div style='text-align:center; padding:20px; color:#721c24; background:#f8d7da; border-radius:4px;'>
                            <strong>¡Casi lo tenemos!</strong><br>
                            Sube este archivo corregido a GitHub para activar el servidor y ver los relatos en tu móvil.
                        </div>`;
            });
    </script>
</body>
</html>
